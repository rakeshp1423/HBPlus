
[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  # EXPO_PUBLIC_* values are intentionally inlined into the client bundle by Expo
  # (public Firebase web config, OAuth client IDs, allowed domain), so exclude them
  # from Netlify's secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_ALLOWED_DOMAIN,EXPO_PUBLIC_FIREBASE_API_KEY,EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,EXPO_PUBLIC_FIREBASE_PROJECT_ID,EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET,EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,EXPO_PUBLIC_FIREBASE_APP_ID,EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID,EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID,EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
